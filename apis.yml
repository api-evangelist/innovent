name: Innovent
description: 'Innovent Biologics (信达生物制药) is a biopharmaceutical company founded in 2011 and
  headquartered in the Suzhou Industrial Park, China, that discovers, develops, manufactures, and
  commercializes high-quality biologic medicines for the treatment of oncology, autoimmune,
  cardiovascular and metabolic, and ophthalmology diseases. Its portfolio includes the PD-1 inhibitor
  Tyvyt (sintilimab), developed in partnership with Eli Lilly, alongside a broad pipeline of monoclonal
  antibodies and other biologics. Innovent is listed on the Hong Kong Stock Exchange (01801.HK) and was
  surfaced through the Hongshan (formerly Sequoia Capital China) portfolio. Innovent is a therapeutics
  company and does not publish a public developer API surface; this profile captures its corporate and
  domain-security identity in the API Evangelist network.'
